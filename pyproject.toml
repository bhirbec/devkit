[project]
name = "pykit"
version = "0.1.0"
description = "A collection of Python utilities"
authors = [{ name = "Benoit Hirbec", email = "benoit.hirbec@gmail.com" }]
requires-python = ">=3.13"

dependencies = [
  "python-dotenv==1.1.0",
  "pydantic==2.11.2",
  "openai>=1.91.0",
  "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0,<8.0.0",
  "pytest-cov>=4.1.0,<5.0.0"
]

[tool.setuptools]
package-dir = {"pykit" = "src"}

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
