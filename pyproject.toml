[project]
name = "pykit"
version = "0.1.0"
description = "A collection of Python utilities"
authors = [{ name = "Benoit Hirbec", email = "benoit.hirbec@gmail.com" }]
requires-python = ">=3.10"

[tool.poetry.dependencies]
python-dotenv = "1.1.0"
openai = "1.76.2"
pyyaml = "^6.0.2"

[tool.poetry]
packages = [
  { include = "src/*" },
]

[tool.setuptools]
package-dir = {"pykit" = "src"}

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
